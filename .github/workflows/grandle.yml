name: Build SBA

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Make gradlew executable
        run: chmod +x gradlew
      
      - name: Build with Gradle
        run: ./gradlew build shadowJar
      
      - name: List all JAR files
        run: |
          echo "=== All JAR files found ==="
          find . -name "*.jar" -type f -ls
          echo "==========================="
      
      - name: Create archive with all JARs
        run: |
          mkdir -p artifacts
          find . -name "*.jar" -type f -not -path "*/build/tmp/*" -exec cp {} artifacts/ \;
          cd artifacts
          ls -la
          
      - name: Upload all JARs as archive
        uses: actions/upload-artifact@v4
        with:
          name: SBA-All-JARs
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
          
      - name: Upload main JAR separately
        uses: actions/upload-artifact@v4
        with:
          name: SBA-Main-JAR
          path: plugin/build/libs/SBA-*.jar
          if-no-files-found: error
          retention-days: 90
